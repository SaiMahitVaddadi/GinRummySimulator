[project]
name = "gin-rummy"
version = "0.2.0"
description = "A fast, dependency-free multi-variant rummy simulator and research testbed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GinRummySimulator contributors" }]
keywords = ["gin-rummy", "rummy", "card-games", "simulator", "reinforcement-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]
llm = ["litellm>=1.40"]
finetune = [
    "transformers>=4.44",
    "peft>=0.13",
    "trl>=0.11",
    "bitsandbytes>=0.44; platform_system != 'Darwin'",
    "accelerate>=0.34",
    "datasets>=3.0",
]
finetune-openai = ["openai>=1.50"]

[project.scripts]
gin-rummy = "gin_rummy.cli:main"

[project.urls]
Repository = "https://github.com/svaddadi/GinRummySimulator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gin_rummy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
